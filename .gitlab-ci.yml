include:
  - project: 'datacluster/gitlab-templates'
    file: 'golang-templates.yaml'

variables:
  GO_VERSION: "1.25"
  GO_BUILD_MAIN_PKG: "./cmd/admin-api/"
  SWAGGER_VALIDATE_DISABLED: "true"
  SWAGGER_VALIDATE_SWAGGER_SPEC: "api/swagger.yaml"
  SAST_OPTIONS: "-exclude=G115"

deploy:testing:
  variables:
    HELM_GLOBAL_VARIABLES: ""
  environment:
    name: nl/test/$CI_COMMIT_REF_NAME
    on_stop: destroy:testing
  script:
    - !reference [.create_deployment, script]

destroy:testing:
  environment:
    name: nl/test/$CI_COMMIT_REF_NAME

deploy:acceptance:
  variables:
    HELM_ACC_VARIABLES: |
      --set global.consul.app_key="acceptance/apis/nl/admin-api"
      --set global.consul.pricing_plans_key="acceptance/apis/pricing-plans"
      --set global.consul.token="${CONSUL_TOKEN}"
  environment:
    name: nl/acc

deploy:production:
  extends: .deploy-template
  variables:
    HELM_PROD_VARIABLES: |
      --set global.consul.app_key="production/apis/nl/admin-api"
      --set global.consul.pricing_plans_key="production/apis/pricing-plans"
      --set global.consul.token="${CONSUL_TOKEN}"
  environment:
    name: nl/prod

terraform:trigger:
  stage: infrastructure
  trigger:
    strategy: depend
    include:
      - project: 'datacluster/gitlab-templates'
        file: 'api/terraform-new-template.yml'
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release-.*$/
      changes:
        - "deployments/terraform/*"
        - "deployments/terraform/**/*"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "deployments/terraform/*"
        - "deployments/terraform/**/*"
    - if: $CI_COMMIT_TAG
      changes:
        - "deployments/terraform/*"
        - "deployments/terraform/**/*"
