include:
  - project: 'datacluster/gitlab-templates'
    file: 'golang-templates.yaml'

variables:
  GO_VERSION: "1.20"
  GO_BUILD_MAIN_PKG: "./cmd/admin-api/"
  SWAGGER_VALIDATE_DISABLED: "true"
  SWAGGER_VALIDATE_SWAGGER_SPEC: "api/swagger.yaml"
  IS_TEMPORAL_WORKFLOW: "true"
  HELM_GLOBAL_VARIABLES: |
    --set global.consul.token="${CONSUL_TOKEN}"

deploy:testing:
  variables:
    HELM_GLOBAL_VARIABLES: ""
  environment:
    name: nl/test/$CI_COMMIT_REF_NAME
    on_stop: destroy:testing
  script:
    - !reference [.create_deployment, script]

destroy:testing:
  environment:
    name: nl/test/$CI_COMMIT_REF_NAME

deploy:testing:de:
  extends: deploy:testing
  variables:
    HELM_GLOBAL_VARIABLES: ""
  environment:
    name: de/test/$CI_COMMIT_REF_NAME
    on_stop: destroy:testing:de
  script:
    - !reference [.create_deployment, script]

destroy:testing:de:
  extends: destroy:testing
  environment:
    name: de/test/$CI_COMMIT_REF_NAME

deploy:acceptance:
  variables:
    HELM_ACC_VARIABLES: |
      --set global.consul.env="acceptance/apis/nl"
  environment:
    name: nl/acc

deploy:acceptance:de:
  extends: deploy:acceptance
  variables:
    HELM_ACC_VARIABLES: |
      --set global.consul.env="acceptance/apis/de"
  environment:
    name: de/acc

deploy:production:
  extends: .deploy-template
  environment:
    name: nl/prod

deploy:production:de:
  extends: deploy:production
  environment:
    name: de/prod
