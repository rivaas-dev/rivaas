    JSONAPILinksObject:
      title: "JSON:API Links Object"
      description: "May contain `self`, `related`, or pagination links (first, last, prev, next)."
      properties:
        self:
          $ref: '#/components/schemas/JSONAPILink'
        first:
          $ref: '#/components/schemas/JSONAPILink'
        last:
          $ref: '#/components/schemas/JSONAPILink'
        prev:
          $ref: '#/components/schemas/JSONAPILink'
        next:
          $ref: '#/components/schemas/JSONAPILink'

    JSONAPILink:
      title: "JSON:API Link"
      description: "A JSON:API link can be either a URL string or a structured link object."
      oneOf:
        - $ref: '#/components/schemas/URL'
        - $ref: '#/components/schemas/JSONAPILinkObject'

    URL:
      type: string
      format: url
      example: 'https://example.com/'

    JSONAPILinkObject:
      title: "JSON:API Link Object"
      description: "a structured representation of a URL"
      type: object
      required:
        - href
      properties:
        href:
          type: string
          example: 'https://example.com/'
        meta:
          type: object
          example:
            count: '10'

    MetaObject:
      title: "Meta information object"
      description: "Some meta information for JSON API response objects"
      type: object
      properties:
        totalPages:
          type: number
          example: 12
        totalResults:
          type: number
          example: 100

    KeyDetailsWithGatewayContext:
      title: KeyDetailsWithGatewayContext
      description: Detailed properties of a key, both from DB and the API Gateway
      oneOf:
        - required:
            - actor_id
            - user_id
          type: object
          properties:
            actor_id:
              type: string
              description: The actor id of the key
            client_id:
              type: integer
              description: The id of the client
            user_id:
              type: integer
              description: The id of the user
      allOf:
        - required:
            - creation_date
          type: object
          properties:
            policies:
              type: array
              example:
                - compliance-monitor-full-access
                - routeplanner-full-access
              items:
                type: string
            expires_at:
              type: string
              description: Date on which the key quota will expire at 00.00 (optional)
              format: date
            quota:
              type: integer
              description: The maximum amount of calls the API Key can make
            quota_remaining:
              type: integer
              description: The remaining amount of calls the API Key can make
            description:
              maxLength: 64
              type: string
              description: Description for the key (optional)
            creation_date:
              type: string
              description: DateTime on which the api key was created
              format: date

    Problem:
      type: object
      properties:
        type:
          type: string
          description: |
            An absolute URI that identifies the problem type.  When dereferenced,
            it SHOULD provide human-readable documentation for the problem type
            (e.g., using HTML).
          format: uri
          default: about:blank
        title:
          type: string
          description: |
            A short, summary of the problem type. Written in english and readable
            for engineers (usually not suited for non technical stakeholders and
            not localized); example: Service Unavailable
        status:
          maximum: 6E+2
          minimum: 1E+2
          type: integer
          description: |
            The HTTP status code generated by the origin server for this occurrence
            of the problem.
          format: int32
          example: 503
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the
            problem.
          example: Connection to database timed out
        instance:
          type: string
          description: |
            An absolute URI that identifies the specific occurrence of the problem.
            It may or may not yield further information if dereferenced.
          format: uri

