version: '3.9'

services:
  tyk:
    image: tykio/tyk-gateway:v4.3
    ports:
      - "8081:8081"
    networks:
      - admin-api-network
    volumes:
      - ./deployments/tyk/test.tyk.conf:/opt/tyk-gateway/tyk.conf
      - ./deployments/tyk/test.policies.json:/opt/tyk-gateway/policies/policies.json
      - ./deployments/tyk/test.api1.json:/opt/tyk-gateway/apps/app_sample1.json
      - ./deployments/tyk/test.api2.json:/opt/tyk-gateway/apps/app_sample2.json
    depends_on:
      - redis

  redis:
    hostname: redis
    image: redis
    networks:
      - admin-api-network

  api:
    profiles:
      - donotstart
    image: registry.ci.fdmg.org/datacluster/docker/go-ci:1.20
    entrypoint: ["go", "run", "cmd/admin-api/main.go"]
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - tyk
      - postgresql
    ports:
      - "8090:8090"

  postgresql:
    image: postgres:12.9-alpine3.15
    ports:
      - "5432:5432"
    networks:
      - admin-api-network
    environment:
      POSTGRES_HOST: localhost
      POSTGRES_DB: admin_api
      POSTGRES_USER: user
      POSTGRES_PASSWORD: secret
    volumes:
      - "./deployments/postgresql/:/docker-entrypoint-initdb.d/"

  temporal:
    image: temporalio/auto-setup:1.21.4
    container_name: temporal
    depends_on:
      - postgresql
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=user
      - POSTGRES_PWD=secret
      - POSTGRES_SEEDS=postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    networks:
      - admin-api-network
    volumes:
      - ./deployments/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    labels:
      kompose.volume.type: configMap

  temporal-ui:
    image: temporalio/ui:2.17.2
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    networks:
      - admin-api-network
    ports:
      - "8181:8080"
  temporal-admin-tools:
    container_name: temporal-admin-tools
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    image: temporalio/admin-tools:latest
    networks:
      - admin-api-network
    stdin_open: true
    tty: true
  sso:
    image: "quay.io/keycloak/keycloak:19.0.3"
    container_name: "keyCloak"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: password
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./deployments/keycloak/keycloak.conf:/opt/keycloak/conf/keycloak.conf
    command:
      - start-dev
      - --db=postgres
      - --db-username=user
      - --db-url-database=keycloak
      - --db-password=secret
    depends_on:
      - postgresql
    ports:
      - "8080:8080"
    networks:
      - admin-api-network

  opa:
   image: openpolicyagent/opa:0.56.0
   ports:
     - "8282:8181"
   volumes:
    - ./deployments/opa/config.yaml:/config.yaml
   command:
     - "run"
     - "--server"
     - "-c"
     - "/config.yaml"

  # Jaeger
  jaeger-all-in-one:
    image: jaegertracing/all-in-one:latest
    restart: always
    ports:
      - "16686:16686"
      - "14268"
      - "14250"
    depends_on:
      - otelcollector

  # OTel Collector
  otelcollector:
    image: otel/opentelemetry-collector:latest
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml", "${OTELCOL_ARGS}"]
    volumes:
      - ./deployments/otel/config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "1888:1888"   # pprof extension
      - "8888:8888"   # Prometheus metrics exposed by the collector
      - "8889:8889"   # Prometheus exporter metrics
      - "13133:13133" # health_check extension
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "55679:55679" # zpages extension
  localstack:
    image: localstack/localstack:latest
    ports:
      - '4566:4566' # LocalStack endpoint
      - '4510-4559:4510-4559' # external services port range
    environment:
      PROVISION_FILES: "true"
      SERVICES: sqs,events
    volumes:
      - ./deployments/localstack/provision.sh:/etc/localstack/init/ready.d/init-aws.sh

networks:
  admin-api-network:
    driver: bridge
    name: admin-api-network