version: '3.3'
services:
  tyk-gateway:
    container_name: agw-api-tyk
    image: tykio/tyk-gateway:v4.2.3
    ports:
      - "8081:8081"
    volumes:
      - ./deployments/tyk/test.tyk.conf:/opt/tyk-gateway/tyk.conf
      - ./deployments/tyk/test.policies.json:/opt/tyk-gateway/policies/policies.json
      - ./deployments/tyk/test.apis.json:/opt/tyk-gateway/apps/app_sample.json
      - ./deployments/tyk/test.api2.json:/opt/tyk-gateway/apps/app_sample2.json
    depends_on:
      - tyk-redis

  tyk-redis:
    image: redis:5.0-alpine
    container_name: agw-api-redis

  api:
    image: registry.ci.fdmg.org/datacluster/docker/go-ci/1.17
    container_name: agw-api
    entrypoint: ["go", "run", "-mod", "vendor", "cmd/api/main.go"]
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - tyk-gateway
    ports:
      - "8080:8080"

  db:
    image: postgres:12.9-alpine3.15
    platform: linux/x86_64
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: key_management
      POSTGRES_USER: key-management-api
      POSTGRES_PASSWORD: "password"
    volumes:
      - "./deployments/postgresql/:/docker-entrypoint-initdb.d/"
